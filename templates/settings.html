{% extends "layout.html" %}

{% block header %} Ustawienia {% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="row">
        <div class="col-12 col-md-8">
           
            <div class="row mb-3">
                <!-- Update form -->
                <div class="col-6 mb-2">
                    <form method="POST" action="/screen-update">
                        <button type="submit" class="btn btn-success w-100">Aktualizuj ekran</button>
                    </form>
                </div>

                <!-- Clear form -->
                <div class="col-6 mb-2">
                    <form method="POST" action="/screen-clear">
                        <button type="submit" class="btn btn-light w-100">Wyczyść ekran</button>
                    </form>
                </div>

                <!-- Restart Raspberry Pi form -->
                <div class="col-6 mb-2">
                    <form method="POST" action="/restart" onsubmit="return confirm('Czy na pewno chcesz zrestartować urządzenie?');">
                        <button type="submit" class="btn btn-light w-100">Restart</button>
                    </form>
                </div>
                
                <!-- Shutdown Raspberry Pi form -->
                <div class="col-6 mb-2">
                    <form method="POST" action="/shutdown" onsubmit="return confirm('Czy na pewno chcesz wyłączyć urządzenie?');">
                        <button type="submit" class="btn btn-light w-100">Wyłącz</button>
                    </form>
                </div>
            </div>

            <form method="POST" action="/settings?saved=true" class="mb-3">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Ustawienie</th>
                            <th>Wartość</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for key, value in settings.items() %}
                        <tr>
                            <td>{{ key }}</td>
                            <td>
                                <input type="text" name="{{ key }}" value="{{ value }}" class="form-control">
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                <button type="submit" class="btn btn-success w-100">Zapisz ustawienia</button>

                {% if request.args.get('saved') == 'true' %}
                    <span>Zapisano!</span>
                {% endif %}
            </form>
        </div>

        <div class="col-12 col-md-4">
            <!-- Formularz dodawania połączenia WiFi -->
            <form method="POST" action="/add_wifi" class="mb-3">
                <label class="font-weight-bold text-secondary">Dodaj sieć</label>
                <div class="form-group">
                    <label for="ssid">SSID:</label>
                    <input type="text" id="ssid" name="ssid" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Hasło:</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Dodaj połączenie WiFi</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
